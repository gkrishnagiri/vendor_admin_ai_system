[project]
name = "backend_v2"
version = "0.1.0"
description = "Production-grade AI Agent backend using Google ADK and LangGraph."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=0.1.1",
    "langgraph>=0.0.15",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=0.0.1",
    "mcp>=0.1.0",
    "playwright>=1.41.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "python-docx>=1.1.2",
    "pypdf>=4.2.0",
    "openai>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
